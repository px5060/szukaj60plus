      const nr = $('nextRow'); if (nr) { nr.style.cursor = 'pointer'; nr.onclick = () => { hlBet = -1; liveOn = !liveOn; applyHL(el); }; }
      el.querySelectorAll('tr[data-i], #nextRow').forEach(r => {   // przytrzymanie wiersza → STATYSTYKI modelu
        let t = null, x0 = 0, y0 = 0; const cancel = () => { clearTimeout(t); t = null; };
        r.addEventListener('pointerdown', e => { r._lp = false; x0 = e.clientX; y0 = e.clientY; cancel(); t = setTimeout(() => { r._lp = true; openStats(selK); }, 550); });
        r.addEventListener('pointermove', e => { if (t && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel(); });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => r.addEventListener(ev, cancel));
        r.addEventListener('contextmenu', e => { e.preventDefault(); cancel(); r._lp = true; openStats(selK); });
        r.addEventListener('click', e => { if (r._lp) { r._lp = false; e.stopImmediatePropagation(); } }, true);
      });
      el.querySelectorAll('tr[data-i]').forEach(r => r.onclick = () => {
        // ponowne dotknięcie obramowanego wiersza zamyka podświetlenie
        if (/\bhl-/.test(r.className)) { hlBet = -1; liveOn = false; applyHL(el); return; }
        const i = +r.dataset.i, b = betOf(i);
        if (lab && lab.K[i] >= 6 && lab.K[i] <= 8) askRowPop(i);
        if (b >= 0 && b < codes.length) { hlBet = b; applyHL(el); return; }
        const m = P[selK], o = lastEval && lastEval.out[selK];   // wiersz bieżącego łańcucha → pokaż stan TERAZ
        if (o) { const L = liveChain(m, o); if ([].concat(L.step, L.stepPart, L.trig, L.trigPart, L.wait).includes(i)) { hlBet = -1; liveOn = true; applyHL(el); } }
      });
    }
    el.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => { if (confirm('Usunąć z MOJE GRY?')) stopMy(b.dataset.stop); });
    el.querySelectorAll('[data-ord]').forEach(b => b.onclick = () => { tabAsc = b.dataset.ord === '1'; try { localStorage.setItem(CFG.app + '_szukajp_v1_asc', tabAsc ? '1' : '0'); } catch (e) {} tabScroll = true; render(); });
    if (lab && tabScroll) { tabScroll = false; if (tabAsc) setTimeout(() => scrollTo(0, document.documentElement.scrollHeight), 0); }
    doFlash(el);
    if (lab && focusRow != null) { const fr = el.querySelector(`tr[data-i="${focusRow}"]`); focusRow = null; if (fr) setTimeout(() => { fr.scrollIntoView({ block: 'center' }); fr.classList.add('fx'); setTimeout(() => fr.classList.remove('fx'), 2600); }, 0); }
    $('evChk') && ($('evChk').onchange = e => { tabEv = e.target.checked; render(); });
    const mb = $('moreBtn'); if (mb) mb.onclick = () => { const h0 = document.documentElement.scrollHeight, y0 = scrollY; tabN += 150; render(); if (tabAsc) scrollTo(0, y0 + document.documentElement.scrollHeight - h0); };
  }
  if (view === 'gra') {
    el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = +b.dataset.k; KS = KS.includes(k) ? KS.filter(x => x !== k) : [...KS, k].sort(); lsSet(LSK.ks, JSON.stringify(KS)); render();
    });
    el.querySelectorAll('[data-oc]').forEach(b => b.onclick = () => { OCF.src = b.dataset.oc; ocSave(); render(); });
    el.querySelectorAll('[data-ol]').forEach(b => b.onclick = () => { const v = b.dataset.ol; OCF.lv = OCF.lv.includes(v) ? OCF.lv.filter(x => x !== v) : [...OCF.lv, v]; ocSave(); render(); });
    el.querySelectorAll('[data-bv]').forEach(b => b.onclick = () => { bustView = bustView === b.dataset.bv ? '' : b.dataset.bv; bustCap = 40; render(); scrollTo(0, 0); });
    el.querySelectorAll('[data-bw]').forEach(b => b.onclick = () => { bustWin = +b.dataset.bw; bustCap = 40; try { localStorage.setItem(CFG.app + '_szukajp_v1_bwin', String(bustWin)); } catch (e) {} render(); });
    { const bm = $('bustMore'); if (bm) bm.onclick = () => { bustCap += 40; render(); }; }
    el.querySelectorAll('[data-mybx]').forEach(b => b.onclick = e => { e.stopPropagation(); mybHide(b.dataset.mybx); render(); });
    el.querySelectorAll('.brow').forEach(r => r.onclick = () => { const k = +r.dataset.bk; goBet({ m: P[k].slice(0, SPECN), id: mid(k, P[k]), row: +r.dataset.brow }); });
    el.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => { mojeTab = b.dataset.mt; render(); scrollTo(0, 0); });
    el.querySelectorAll('[data-mine]').forEach(b => b.onclick = () => { onlyMine = !onlyMine; mojeTab = 'gry'; try { localStorage.setItem(CFG.app + '_szukajp_v1_onlymine', onlyMine ? '1' : '0'); } catch (e) {} render(); scrollTo(0, 0); });
    el.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
      const all = R.rules.map((_, j) => j), i = +b.dataset.b;   // jeden przedział cykli naraz; ponowne dotknięcie = wszystkie (żaden nie podświetlony)
      BANDS = BANDS.length === 1 && BANDS[0] === i ? all : [i]; lsSet(LSK.bands, JSON.stringify(BANDS)); render();
    });
    el.querySelectorAll('[data-stop]').forEach(b => b.onclick = e => { e.stopPropagation(); if (confirm('Usunąć z MOJE GRY?')) stopMy(b.dataset.stop); });
    el.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { const i = +b.dataset.more; bandCap[i] = (bandCap[i] || 15) + 30; render(); });
    el.querySelectorAll('[data-mk]').forEach(bindCard);
  }
  if (view === 'ust') {
    const fi = $('findIn'), go = () => { findQ = fi.value.trim(); render(); };
    $('findBtn').onclick = go; fi.onkeydown = e => { if (e.key === 'Enter') go(); };
    const ft = $('findTab'); if (ft) ft.onclick = () => openTab(findModel(findQ));
    const fp = $('findPlay'); if (fp) fp.onclick = () => startMy(findModel(findQ));
    el.querySelectorAll('[data-mk]').forEach(bindCard);
    $('saveR').onclick = () => {
      const rules = R.rules.map(r => [...r]);
      el.querySelectorAll('.rules input[data-i]').forEach(i => { rules[+i.dataset.i][+i.dataset.j] = Math.max(0, parseInt(i.value, 10) || 0); });
      rules.sort((a, b) => (a[0] === null) - (b[0] === null) || a[0] - b[0]);
      R = { rules, minCyc: Math.max(1, parseInt($('minC').value, 10) || 1) }; lsSet(LSK.rules, JSON.stringify(R)); toast('Zapisano kryteria'); recompute();
    };
    $('defR').onclick = () => { R = { rules: CFG.defRules, minCyc: CFG.minCyc }; lsSet(LSK.rules, ''); recompute(); };
    $('impBtn').onclick = () => $('impIn').click();
    $('impIn').onchange = e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { try { importCodes(rd.result, f.name); } catch (err) { alert('Import przerwany, nic nie zmieniono:\n' + err.message); } };
      rd.readAsText(f);
    };
    if ($('clrF')) $('clrF').onclick = () => { if (confirm('Usunąć stare modele znalezione w appce z tego urządzenia?')) { lsSet(foundKey(), '[]'); recompute(); } };
  }
}
hint(); renderTgt(); recompute();
// świeżość: SW (strona zawsze z sieci) + sprawdzenie wersji na serwerze
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('szukaj-sw.js', { scope: './' }).catch(() => {}); } catch (e) {}
let instEv = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEv = e; $('instBtn').style.display = 'block'; });
$('instBtn').onclick = async () => { if (!instEv) return; instEv.prompt(); try { await instEv.userChoice; } catch (e) {} instEv = null; $('instBtn').style.display = 'none'; };
async function checkVersion() {
  try {
    const t = await (await fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' })).text();
    const m = /const APP_VER = '([^']+)'/.exec(t);
    if (m && m[1] !== APP_VER && !$('updBan')) {
      const d = document.createElement('div'); d.id = 'updBan'; d.className = 'upd';
      d.textContent = `Jest nowa wersja ${m[1]} (masz ${APP_VER}) — stuknij, żeby odświeżyć`;
      d.onclick = () => location.replace(location.pathname + '?v=' + m[1]);
      $('main').prepend(d);
    }
  } catch (e) {}
}
checkVersion(); document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });
</script>
<script>
"use strict";
// ===== napisy na ekranie: BUST → LOST (tylko to, co widać; dane, zapisy i obliczenia bez zmian) =====
function LOSTIFY(doc, keepNames) {   // keepNames: zostaw nazwę tabeli / modeli „BUST” z RAZEM T60 (2 = też sam napis „BUST”, np. zakładka tabeli)
  try {
    if (!doc || doc.__lost) return; doc.__lost = 1;
    const RX = keepNames ? /\bBUST\b(?! 012| ·| [A-Z]\d[A-Z0-9])|\bbusty\b|\bBusty\b/g : /\bBUST\b|\bbusty\b|\bBusty\b/g;
    const keep = v => keepNames === 2 && /^\s*BUST\s*$/.test(v);
    const fix = n => { const pa = n.parentNode; if (pa && /^(SCRIPT|STYLE|TEXTAREA)$/.test(pa.nodeName)) return; const v = n.nodeValue; if (!v || !/BUST|usty/.test(v) || keep(v)) return; const f = v.replace(RX, m => m === 'BUST' ? 'LOST' : m === 'busty' ? 'losty' : 'Losty'); if (f !== v) n.nodeValue = f; };
    const walk = r => { if (r.nodeType === 3) return fix(r); if (r.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(r.nodeName)) return; const w = doc.createTreeWalker(r, 4); let n; while ((n = w.nextNode())) fix(n); };
    const root = doc.body || doc.documentElement; walk(root);
    new doc.defaultView.MutationObserver(ms => ms.forEach(m => m.type === 'characterData' ? fix(m.target) : m.addedNodes.forEach(walk)))
      .observe(root, { childList: true, subtree: true, characterData: true });
  } catch (e) {}
}
LOSTIFY(document, false);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // pamięć trwała: Android nie czyści jej sam przy braku miejsca
</script>
