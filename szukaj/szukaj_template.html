<script id="wsrc" type="text/js-worker">
"use strict";
// ===== SILNIK — FSM 1:1 z appek RAZEM (silnik 1T) i szukaj/engine.py =====
const ST = [8, 8, 16, 32, 64, 128, 256, 512], CUM = [8, 16, 32, 64, 128, 256, 512, 1024];
let AL = [], X = null, N = 0, Y = null;
const m1 = (p, c) => p.split('∪').some(q => q.length === 3 && [...q].every((x, i) => x === 'x' || x === c[i]));
function table(pred) {
  const parts = pred.split(' → '), t = new Uint8Array(3 * AL.length);
  parts.forEach((p, j) => AL.forEach((c, k) => { t[j * AL.length + k] = m1(p, c) ? 1 : 0; }));
  return { t, L: parts.length };
}
const _tc = new Map();
function tab(pred) { let v = _tc.get(pred); if (!v) { v = table(pred); _tc.set(pred, v); } return v; }
function hit(P, i) {
  if (i < P.L - 1) return false;
  const A = AL.length;
  for (let j = 0; j < P.L; j++) if (!P.t[j * A + X[i - P.L + 1 + j]]) return false;
  return true;
}
function limitFor(cyc, rules) { for (const [mc, mb] of rules) if (mc === null || cyc <= mc) return mb; return null; }
function qual(cyc, bu, R) { if (cyc < R.minCyc) return false; const l = limitFor(cyc, R.rules); return l !== null && bu <= l; }
// m = [typ, STEP, x, TRIGGER, off, tn, STEP2]: STEP ×x → [STEP2 raz] → TRIGGER ×tn (kolejne trafienia) → zakład na ostatnim TRIGGER+off
// st: 0 czekam na STEP · 1 czekam na STEP2 · 2 liczę TRIGGERY (tc = ile już było)
function sim(m, R) {
  const S = tab(m[1]), T = tab(m[3]), x = m[2], off = m[4], tn = m[5] || 1, S2 = m[6] ? tab(m[6]) : null;
  let st = 0, cnt = 0, tc = 0, bs = 0, i = 0, pnl = 0, nb = 0, nw = 0, nbu = 0, k5 = 0, k5w = 0, k5b = 0, srow = -1, wz = -1, ph = 0, le = -1, lt = 0, lk = 0;
  let cyc = 0, lb = -1, lbr = -1, pb = 0, pw = 0;   // cykle po BUST-cie: pb = BUST od razu po BUST-cie, pw = WIN po BUST-cie
  while (i < N) {
    if (st === 0) {
      if (hit(S, i)) { cnt++; if (cnt >= x) { st = S2 ? 1 : 2; srow = i; } } else cnt = 0;
      i++;
    } else if (st === 1) { if (hit(S2, i)) st = 2; i++; }
    else if (hit(T, i)) {
      tc++; if (tc < tn) { i++; continue; }
      const bp = i + off;
      if (bp >= N) { ph = 2; wz = bp; break; }
      const w = Y[X[bp]] === 1;
      nb++; if (bs === 4) k5++;
      if (w) { pnl += ST[bs] * 3 - CUM[bs]; nw++; if (bs >= 4) k5w++; le = bp; lt = 1; lk = bs + 1; bs = 0; if (lb >= 0 && lb === cyc - 1) pw++; cyc++; }
      else if (bs === 7) { pnl -= CUM[7]; nbu++; k5b++; le = bp; lt = 2; lk = 8; bs = 0; if (lb >= 0 && lb === cyc - 1) pb++; lb = cyc; lbr = bp; cyc++; }
      else bs++;
      st = 0; cnt = 0; tc = 0; i = bp + 1;
    } else i++;
  }
  if (ph === 0 && st >= 1) ph = 1;
  return { nb, nw, nbu, pnl, k5, k5w, k5b, bs, ph, srow, wz, cnt, st, tc, le, lt, lk, sinceB: lb >= 0 ? cyc - 1 - lb : -1, lbr, pb, pw };
}
// etykiety wierszy dla jednego modelu (TABELA): K = rodzaj, A = licznik/krok, B = wiersz zakładu / zysk, Q = model spełniał kryteria
// K: 0 czekam na STEP · 1 czekam na TRIGGER (A = ile TRIGGERÓW już było) · 2 step n/x · 3 STEP · 4 TRIGGER (ostatni → zakład) · 5 przed grą
//    6 WIN · 7 przegrana · 8 BUST · 9 licznik → 0 · 10 STEP2 · 11 czekam na STEP2 · 12 TRIGGER n/tn (jeszcze nie ostatni; A = n)
function labels(m, R) {
  const S = tab(m[1]), T = tab(m[3]), x = m[2], off = m[4], tn = m[5] || 1, S2 = m[6] ? tab(m[6]) : null;

function foundKey() { return LSK.found + tgt; }
function getFound() { try { const v = JSON.parse(lsGet(foundKey(), '[]')); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function pool() {   // pula z chmury (znaleziona na bazie do Nr seedN; szukanie w telefonie wyłączone) — dawniej też znalezione w appce (m[7] = Nr znalezienia) + MOJE GRY spoza puli

function stepSpace() {   // ta sama przestrzeń co szukaj/search.py
  const pats = []; for (const a of CFG.first) for (const b of '01x') for (const c of '01x') if (a + b + c !== 'xxx') pats.push(a + b + c);
  const step = [], trig = [...pats];
  const comb = (arr, r, st = 0, cur = []) => { if (cur.length === r) { step.push(['S', cur.join('∪')]); return; } for (let i = st; i < arr.length; i++) comb(arr, r, i + 1, [...cur, arr[i]]); };
  for (let r = 1; r <= CFG.maxUnion; r++) comb(AL, r);
  for (const p of pats) for (const q of pats) { step.push(['U', p + ' → ' + q]); trig.push(p + ' → ' + q); }
  return { step, trig };
}
