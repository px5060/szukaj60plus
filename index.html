<script id="wsrc" type="text/js-worker">
"use strict";
// ===== SILNIK — FSM 1:1 z appek RAZEM (silnik 1T) i szukaj/engine.py =====
const ST = [8, 8, 16, 32, 64, 128, 256, 512], CUM = [8, 16, 32, 64, 128, 256, 512, 1024];
let AL = [], X = null, N = 0, Y = null;
const m1 = (p, c) => p.split('∪').some(q => q.length === 3 && [...q].every((x, i) => x === 'x' || x === c[i]));
function table(pred) {
  const parts = pred.split(' → '), t = new Uint8Array(3 * AL.length);
  parts.forEach((p, j) => AL.forEach((c, k) => { t[j * AL.length + k] = m1(p, c) ? 1 : 0; }));
  return { t, L: parts.length };
}
const _tc = new Map();
function tab(pred) { let v = _tc.get(pred); if (!v) { v = table(pred); _tc.set(pred, v); } return v; }
function hit(P, i) {
  if (i < P.L - 1) return false;
  const A = AL.length;
  for (let j = 0; j < P.L; j++) if (!P.t[j * A + X[i - P.L + 1 + j]]) return false;
  return true;
}
function limitFor(cyc, rules) { for (const [mc, mb] of rules) if (mc === null || cyc <= mc) return mb; return null; }
function qual(cyc, bu, R) { if (cyc < R.minCyc) return false; const l = limitFor(cyc, R.rules); return l !== null && bu <= l; }
// m = [typ, STEP, x, TRIGGER, off, tn, STEP2]: STEP ×x → [STEP2 raz] → TRIGGER ×tn (kolejne trafienia) → zakład na ostatnim TRIGGER+off
// st: 0 czekam na STEP · 1 czekam na STEP2 · 2 liczę TRIGGERY (tc = ile już było)
function sim(m, R) {
  const S = tab(m[1]), T = tab(m[3]), x = m[2], off = m[4], tn = m[5] || 1, S2 = m[6] ? tab(m[6]) : null;
  let st = 0, cnt = 0, tc = 0, bs = 0, i = 0, pnl = 0, nb = 0, nw = 0, nbu = 0, k5 = 0, k5w = 0, k5b = 0, srow = -1, wz = -1, ph = 0, le = -1, lt = 0, lk = 0;
  while (i < N) {
    if (st === 0) {
      if (hit(S, i)) { cnt++; if (cnt >= x) { st = S2 ? 1 : 2; srow = i; } } else cnt = 0;
      i++;
    } else if (st === 1) { if (hit(S2, i)) st = 2; i++; }
    else if (hit(T, i)) {
      tc++; if (tc < tn) { i++; continue; }
      const bp = i + off;
      if (bp >= N) { ph = 2; wz = bp; break; }
      const w = Y[X[bp]] === 1;
      nb++; if (bs === 4) k5++;
      if (w) { pnl += ST[bs] * 3 - CUM[bs]; nw++; if (bs >= 4) k5w++; le = bp; lt = 1; lk = bs + 1; bs = 0; }
      else if (bs === 7) { pnl -= CUM[7]; nbu++; k5b++; le = bp; lt = 2; lk = 8; bs = 0; }
      else bs++;
      st = 0; cnt = 0; tc = 0; i = bp + 1;
    } else i++;
  }
  if (ph === 0 && st >= 1) ph = 1;
  return { nb, nw, nbu, pnl, k5, k5w, k5b, bs, ph, srow, wz, cnt, st, tc, le, lt, lk };
}
// etykiety wierszy dla jednego modelu (TABELA): K = rodzaj, A = licznik/krok, B = wiersz zakładu / zysk, Q = model spełniał kryteria
// K: 0 czekam na STEP · 1 czekam na TRIGGER (A = ile TRIGGERÓW już było) · 2 step n/x · 3 STEP · 4 TRIGGER (ostatni → zakład) · 5 przed grą
//    6 WIN · 7 przegrana · 8 BUST · 9 licznik → 0 · 10 STEP2 · 11 czekam na STEP2 · 12 TRIGGER n/tn (jeszcze nie ostatni; A = n)
function labels(m, R) {
  const S = tab(m[1]), T = tab(m[3]), x = m[2], off = m[4], tn = m[5] || 1, S2 = m[6] ? tab(m[6]) : null;
  const K = new Int8Array(N), A = new Int16Array(N), B = new Int32Array(N), Q = new Int8Array(N);
  let st = 0, cnt = 0, tc = 0, bs = 0, i = 0, nw = 0, nbu = 0;
  while (i < N) {
    if (st === 0) {
      if (hit(S, i)) { cnt++; if (cnt >= x) { st = S2 ? 1 : 2; K[i] = 3; } else { K[i] = 2; } A[i] = cnt; }
      else { K[i] = cnt > 0 ? 9 : 0; cnt = 0; }
      i++;
    } else if (st === 1) { if (hit(S2, i)) { st = 2; K[i] = 10; } else K[i] = 11; i++; }
    else if (hit(T, i)) {
      tc++;
      if (tc < tn) { K[i] = 12; A[i] = tc; i++; continue; }
      const bp = i + off;
      K[i] = 4; A[i] = bs + 1; B[i] = bp; Q[i] = qual(nw + nbu, nbu, R) ? 1 : 0;
      for (let j = i + 1; j < Math.min(bp, N); j++) { K[j] = 5; A[j] = bs + 1; B[j] = bp; Q[j] = Q[i]; }
      if (bp >= N) break;
      const w = Y[X[bp]] === 1;

    $('saveR').onclick = () => {
      const rules = R.rules.map(r => [...r]);
      el.querySelectorAll('.rules input[data-i]').forEach(i => { rules[+i.dataset.i][+i.dataset.j] = Math.max(0, parseInt(i.value, 10) || 0); });
      rules.sort((a, b) => (a[0] === null) - (b[0] === null) || a[0] - b[0]);
      R = { rules, minCyc: Math.max(1, parseInt($('minC').value, 10) || 1) }; lsSet(LSK.rules, JSON.stringify(R)); toast('Zapisano kryteria'); recompute();
    };
    $('defR').onclick = () => { R = { rules: CFG.defRules, minCyc: CFG.minCyc }; lsSet(LSK.rules, ''); recompute(); };
    $('impBtn').onclick = () => $('impIn').click();
    $('impIn').onchange = e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { try { importCodes(rd.result, f.name); } catch (err) { alert('Import przerwany, nic nie zmieniono:\n' + err.message); } };
      rd.readAsText(f);
    };
    if ($('clrF')) $('clrF').onclick = () => { if (confirm('Usunąć stare modele znalezione w appce z tego urządzenia?')) { lsSet(foundKey(), '[]'); recompute(); } };
  }
}
hint(); renderTgt(); recompute();
// świeżość: SW (strona zawsze z sieci) + sprawdzenie wersji na serwerze
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('szukaj-sw.js', { scope: './' }).catch(() => {}); } catch (e) {}
let instEv = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEv = e; $('instBtn').style.display = 'block'; });
$('instBtn').onclick = async () => { if (!instEv) return; instEv.prompt(); try { await instEv.userChoice; } catch (e) {} instEv = null; $('instBtn').style.display = 'none'; };
async function checkVersion() {
  try {
    const t = await (await fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' })).text();
    const m = /const APP_VER = '([^']+)'/.exec(t);
    if (m && m[1] !== APP_VER && !$('updBan')) {
      const d = document.createElement('div'); d.id = 'updBan'; d.className = 'upd';
      d.textContent = `Jest nowa wersja ${m[1]} (masz ${APP_VER}) — stuknij, żeby odświeżyć`;
      d.onclick = () => location.replace(location.pathname + '?v=' + m[1]);
      $('main').prepend(d);
    }
  } catch (e) {}
}
checkVersion(); document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });
</script>
